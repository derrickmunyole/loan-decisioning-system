[project]
name = "synthetic-data-generator"
version = "0.1.0"
description = "Seeds demo applications through the real REST API rather than faking terminal states."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "faker>=30.0",
]

[project.scripts]
synthetic-data-generator = "synthetic_data_generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_data_generator"]
