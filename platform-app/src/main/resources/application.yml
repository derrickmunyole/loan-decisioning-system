spring:
  application:
    name: loan-decisioning-platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/security,classpath:db/migration/infrastructure,classpath:db/migration/origination,classpath:db/migration/workflow,classpath:db/migration/verification,classpath:db/migration/decisioning
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: PT1H
    seed-users-password: ${SEED_USERS_PASSWORD:ChangeMe123!}
  outbox:
    relay-interval: 2000
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:loan_app}
      secret-key: ${MINIO_ROOT_PASSWORD:loan_app_secret}
      bucket: loan-documents
  credit-score:
    base-url: ${CREDIT_SCORE_SERVICE_URL:http://localhost:8001}
    timeout: PT3S

resilience4j:
  circuitbreaker:
    instances:
      creditScore:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
