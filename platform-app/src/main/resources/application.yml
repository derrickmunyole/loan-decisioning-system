spring:
  application:
    name: loan-decisioning-platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/security,classpath:db/migration/infrastructure
  rabbitmq:
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: PT1H
    seed-users-password: ${SEED_USERS_PASSWORD:ChangeMe123!}
  outbox:
    relay-interval: 2000
