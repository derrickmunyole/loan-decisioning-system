spring:
  application:
    name: loan-decisioning-platform
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/security

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: PT1H
    seed-users-password: ${SEED_USERS_PASSWORD:ChangeMe123!}
